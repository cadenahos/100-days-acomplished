services:
  mongodb:
    image: mongo:latest
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ChallengeStoreDatabase__ConnectionString=mongodb://mongodb:27017
      - Google__ClientId=${VITE_GOOGLE_CLIENT_ID:-1050946274220-epl15kduuol27hj6m2ubr06gp0t6v9u1.apps.googleusercontent.com}
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-1050946274220-epl15kduuol27hj6m2ubr06gp0t6v9u1.apps.googleusercontent.com}
    ports:
      - "3000:8080"
    environment:
      # Mirrors Cloud Run: the proxy target is a runtime setting, not baked in.
      - PORT=8080
      - BACKEND_URL=http://backend:8080
    depends_on:
      - backend

volumes:
  mongodb_data:
